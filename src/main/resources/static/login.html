<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Title</title>
</head>
<body>
<header>
    <h1>WYNAJEM SAMOCHODOW - witaj </h1>
    <span id="witaj-tekst">witaj</span>
    <ul>
        <!-- Przycisk PANEL UZYTKOWNIKA- widoczny tylko dla zalogowanych -->
        <li><a href="/uzytkownik_panel" id="btn-panel" class="zalogujButton hidden">Moje konto</a></li>

        <!-- Przycisk WYLOGUJ - widoczny tylko dla zalogowanych -->
        <li><a href="/logout" id="btn-wyloguj" class="zalogujButton hidden">Wyloguj</a></li>

        <!-- Przycisk ZALOGUJ - widoczny tylko dla niezalogowanych -->
        <li><a href="/login" id="btn-zaloguj" class="zalogujButton">Zaloguj</a></li>
    </ul>
</header>
<nav>
    <ul>
        <li><a href="glowna.html">Home</a></li>
        <li><a href="wyszukaj.html">Oferta</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
        <li><a href="onas.html">O nas</a></li>
    </ul>
</nav>
<div class="loginPage">
    <div class="login">
        <h2>Zaloguj się</h2>
        <!-- /login powinien sie wywoływać z javy i w javie powinna być waldacja z bazą -->
        <form action="/login" method="post">
            <label>Login:</label>
            <input type="text" name="login" required>

            <label>Hasło:</label>
            <input type="password" name="password" required>

            <button type="submit">Zaloguj</button>
        </form>
    </div>
    <div class="rejestracja">
        <h2>Nie masz konta? Nie ma problemu! Zarejestruj się!</h2>
        <!--To samo co wyżej - /register wywoływany z javy + obsługa formularza (hasła)-->
        <form action="/register" method="post">
            <label>Login:</label>
            <input type="text" name="login" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Hasło:</label>
            <input type="password" name="password" required>

            <label>Powtórz hasło:</label>
            <input type="password" name="confirmPassword" required>

            <label>Imię:</label>
            <input type="text" name="imie" required>

            <label>Nazwisko:</label>
            <input type="text" name="nazwisko" required>

            <label>Adres:</label>
            <input type="text" name="adres" >

            <label>Miejscowość:</label>
            <input type="text" name="miejscowosc">

            <label>Nr telefonu:</label>
            <input type="number" name="nrTel" required>

            <label>Nr dowodu:</label>
            <input type="text" name="nrDowodu">

            <label>Data urodzenia:</label>
            <input type="date" name="dataUr" required>

            <input type="checkbox" class="regChk" name="reg" required>
            <label>Zapoznałem/łam się z <a class="regChk" href="regulamin" target="_blank">regulaminem</a>.</label>

            <button type="submit">Zarejestruj</button>
        </form>
    </div>
</div>
<script src="/js/session-handler.js"></script>
</body>
</html>
