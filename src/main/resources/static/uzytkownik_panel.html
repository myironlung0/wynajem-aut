<!DOCTYPE html>

    <title>Panel użytkownika</title>
</head>
<body>
<header>
    <h1>WYNAJEM SAMOCHODÓW - Panel użytkownika</h1>
    <ul><li><a href="/logout" class="zalogujButton">Wyloguj</a></li></ul>
</header>
<nav>

        <li><a href="glowna.html">Home</a></li>

    </ul>
</nav>
<div class="uzytkownik_panel">
    <h2>Twoje dane</h2>
    <form action="/uzytkownik_panel/update" method="post">
        <label>Imię: *</label>
        <input type="text" name="imie" id="imie" required>

        <label>Nazwisko: *</label>
        <input type="text" name="nazwisko" id="nazwisko" required>

        <label>Nr telefonu: *</label>
        <input type="number" name="nrTel" id="nrTel" required>

        <label>Adres:</label>
        <input type="text" name="adres" id="adres">

        <label>Miejscowość:</label>
        <input type="text" name="miejscowosc" id="miejscowosc">

        <label>Nr dowodu:</label>
        <input type="text" name="nrDowodu" id="nrDowodu">

        <button type="submit">Zapisz zmiany</button>
    </form>
</div>
</body>
</html>
